name: Release

# Hai cách chạy:
#  1. Push tag dạng v* (vd: v0.23.0-vi2) → dùng keystore trong Secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD).
#  2. Chạy tay (workflow_dispatch) → nhập tag và keystore qua input; input nào để trống thì lấy từ Secrets.
# Kết quả: build APK release đã ký → tạo GitHub Release kèm các file APK.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tên tag cho Release (vd: v0.23.0-vi1)"
        required: true
      keystore_base64:
        description: "Keystore dạng base64 (để trống = dùng secret KEYSTORE_BASE64)"
        required: false
      keystore_password:
        description: "Mật khẩu keystore/key (để trống = dùng secret)"
        required: false
      key_alias:
        description: "Alias của key (để trống = dùng secret)"
        required: false

permissions:
  contents: write # cần quyền ghi để tạo tag và Release

jobs:
  release:
    name: Build & publish release APK
    runs-on: ubuntu-latest
    steps:
      # Engine là submodule (lồng thêm nightread) → phải recursive.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Giống ci.yml: phải ghi rõ packages; NDK/CMake để AGP tự tải theo ndkVersion.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Giải mã keystore và tạo keystore.properties (chỉ tồn tại trong máy CI, không commit).
      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ inputs.keystore_base64 || secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ inputs.keystore_password || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ inputs.key_alias || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ inputs.keystore_password || secrets.KEY_PASSWORD }}
        run: |
          echo "::add-mask::$KEYSTORE_PASSWORD"
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Thiếu keystore (input keystore_base64 hoặc secret KEYSTORE_BASE64)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
